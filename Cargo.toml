[package]
name = "ramble-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Ramble Contributors"]
description = "Native Linux desktop notifications daemon for Ramble chat"
license = "MIT OR Apache-2.0"

[dependencies]
# HTTP & Async Runtime
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "0.8"
dirs = "5.0"

# Notifications
notify-rust = "4.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# SSE parsing
eventsource-stream = "0.2"
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
